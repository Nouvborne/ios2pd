name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          cmake --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Cache iOS dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: build/deps-ios
          key: deps-ios-${{ runner.os }}-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Build OpenSSL / Boost / zlib for iOS
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: ./scripts/build-deps.sh

      - name: Build i2pd static libraries
        run: ./scripts/build-i2pd.sh

      - name: Build iOS app
        run: ./scripts/build-app.sh

      - name: Package unsigned IPA
        run: ./scripts/make-ipa.sh

      - name: Inspect artifacts
        run: |
          file build/ios2pd.app/ios2pd
          ls -lh build/dist

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios2pd-unsigned-ipa
          path: build/dist/ios2pd-unsigned.ipa
          if-no-files-found: error

      - name: Share unsigned IPA (Litterbox 72h, catbox fallback)
        run: |
          URL=""
          if LIT=$(curl -fsS \
              -F "reqtype=fileupload" \
              -F "time=72h" \
              -F "fileToUpload=@build/dist/ios2pd-unsigned.ipa" \
              https://litterbox.catbox.moe/resources/internals/api.php 2>/dev/null); then
            case "$LIT" in
              https://litter.catbox.moe/*.ipa) URL="$LIT" ;;
              *) echo "!! Litterbox returned an unexpected response: $LIT" ;;
            esac
          else
            echo "!! Litterbox upload failed (HTTP ${?}); falling back to catbox.moe"
          fi
          if [ -z "$URL" ]; then
            URL=$(curl -fsS \
              -F "reqtype=fileupload" \
              -F "fileToUpload=@build/dist/ios2pd-unsigned.ipa" \
              https://catbox.moe/user/api.php)
          fi
          echo "## IPA download link" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Download URL: $URL"
